<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#c9bcc6}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin } from '@pixiv/three-vrm';
const scene = new THREE.Scene();
scene.background = new THREE.Color('#d8cdd4');
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, .01, 20);
camera.position.set(0, 1.46, 1.05);
camera.lookAt(0, 1.44, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#fff5fc', '#b99cad', 1.4));
const key = new THREE.DirectionalLight('#fff2e4', 1.4);
key.position.set(-2, 4, 3.5);
scene.add(key);
const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));
loader.load('./assets/mira.vrm', gltf => {
  const vrm = gltf.userData.vrm;
  vrm.scene.rotation.y = Math.PI;
  scene.add(vrm.scene);
  vrm.scene.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
  window.vrm = vrm;
}, undefined, e => console.error(e));
function loop() { requestAnimationFrame(loop); if (window.vrm) window.vrm.update(.016); renderer.render(scene, camera); }
loop();
</script></body></html>
